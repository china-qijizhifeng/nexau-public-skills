type: tool
name: finnhub_quote
description: >-
  Get real-time stock quote including current price, change, percent change,
  high, low, open, previous close, and timestamp.
# ⚠️ 本工具在 agent.yaml 里带 extra_kwargs（api_token），input_schema 切勿加 additionalProperties: false：
# extra_kwargs 会被 merge 进参数后参与 jsonschema 校验，加了必报 "Additional properties are not allowed ('api_token' was unexpected)"。
input_schema:
  type: object
  properties:
    symbol:
      type: string
      description: Stock ticker symbol (e.g. 'AAPL', 'MSFT').
  required:
    - symbol
  $schema: http://json-schema.org/draft-07/schema#
